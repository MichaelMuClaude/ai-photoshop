[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-photoshop"
version = "0.1.0"
description = "Edit images with a recipe of explicit steps that an AI agent can write, apply, and check"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pillow>=10.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ai-photoshop = "ai_photoshop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_photoshop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
